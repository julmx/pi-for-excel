name: Temporary npm lockfile sync

on:
  push:
    branches: [fix/dependency-security-2026-10]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify full audit
        run: npm audit --audit-level=moderate
      - name: Commit reproducible lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): lock compatible fs-extra for Office validation"
            git push origin HEAD:fix/dependency-security-2026-10
          fi
