name: Enterprise hardening checks

on:
  push:
    branches:
      - "feature/enterprise-*"
  pull_request:
    branches:
      - "feature/enterprise-*"

permissions:
  contents: read

jobs:
  enterprise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run check
      - name: Run enterprise policy tests
        run: npm run test:enterprise
      - name: Run model tests
        run: npm run test:models
      - name: Run custom gateway and localization regression tests
        run: node --test --experimental-strip-types --import ./scripts/register-test-ts-loader.mjs tests/custom-gateways.test.ts tests/i18n-locales.test.ts
      - name: Build regular release
        run: npm run build
      - name: Build restricted release
        env:
          VITE_PI_ENTERPRISE_MODE: "true"
          VITE_PI_ENTERPRISE_API_BASE_URL: https://api.example.invalid/llm/v1
        run: npm run build
      - name: Generate local Windows sideload manifest
        run: npm run manifest:enterprise:local
      - name: Build restricted local relay release
        env:
          VITE_PI_ENTERPRISE_MODE: "true"
          VITE_PI_ENTERPRISE_API_BASE_URL: https://127.0.0.1:3141/__enterprise-api
        run: npm run build
      - name: Install Chromium for gateway UI regression
        run: npx playwright install chromium --with-deps
      - name: Verify custom gateway settings in Chromium
        run: node --test --test-concurrency=1 --experimental-strip-types --import ./scripts/register-test-ts-loader.mjs tests/browser/custom-gateway.browser-test.ts

  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse PowerShell launcher without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/start-enterprise-local.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Enterprise Windows launcher syntax is valid."
