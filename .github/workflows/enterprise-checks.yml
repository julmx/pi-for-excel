name: Enterprise hardening checks

on:
  push:
    branches:
      - "feature/enterprise-*"
  pull_request:
    branches:
      - "feature/enterprise-*"

permissions:
  contents: read

jobs:
  enterprise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run check
      - name: Check local HTTPS server syntax
        run: |
          node --check scripts/serve-dist-https.mjs
          node --check scripts/enterprise-api-relay.mjs
      - name: Run enterprise policy tests
        run: npm run test:enterprise
      - name: Run model tests
        run: npm run test:models
      - name: Build regular release
        run: npm run build
      - name: Build restricted release
        env:
          VITE_PI_ENTERPRISE_MODE: "true"
          VITE_PI_ENTERPRISE_API_BASE_URL: https://api.example.invalid/llm/v1
          # Browser CI uses loopback HTTP; production defaults to HTTPS.
          VITE_PI_ENTERPRISE_TASKPANE_ORIGIN: http://127.0.0.1:3141
          VITE_PI_ENTERPRISE_RUNNER_ORIGIN: http://localhost:3141
        run: npm run build
      - name: Smoke-test bundled Python, NumPy and pandas
        run: node scripts/smoke-enterprise-pyodide.mjs
      - name: Install Chromium for Python Worker integration
        run: npx playwright install chromium --with-deps
      - name: Exercise built Python Worker and Excel RPC in Chromium
        run: node scripts/smoke-enterprise-python-browser.mjs
      - name: Confirm isolated Python cannot read taskpane IndexedDB (Linux)
        run: node scripts/smoke-enterprise-isolated-runner.mjs
      - name: Generate local Windows sideload manifest
        run: npm run manifest:enterprise:local

  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse PowerShell launcher without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/start-enterprise-local.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Enterprise Windows launcher syntax is valid."
      - name: Setup Node.js for Windows Python smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build enterprise Web Worker on Windows
        env:
          VITE_PI_ENTERPRISE_MODE: "true"
          VITE_PI_ENTERPRISE_API_BASE_URL: https://api.example.invalid/llm/v1
          # Browser CI uses loopback HTTP; production defaults to HTTPS.
          VITE_PI_ENTERPRISE_TASKPANE_ORIGIN: http://127.0.0.1:3141
          VITE_PI_ENTERPRISE_RUNNER_ORIGIN: http://localhost:3141
        run: npm run build
      - name: Install Chromium for Windows Worker smoke
        run: npx playwright install chromium
      - name: Run Python Excel Worker in Windows Chromium
        run: node scripts/smoke-enterprise-python-browser.mjs
      - name: Confirm isolated Python cannot read taskpane IndexedDB (Windows)
        run: node scripts/smoke-enterprise-isolated-runner.mjs
