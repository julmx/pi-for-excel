# GitHub's dependency-review-action requires the Dependency Graph feature.
# This fork currently does not have that capability enabled. Audit the entire
# resolved npm tree on every PR and push until Dependency Graph is available.
name: Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund

      - name: Audit all dependencies (including development tools)
        run: npm audit --audit-level=moderate

      - name: Audit production dependencies separately
        run: npm audit --omit=dev --audit-level=moderate
