name: Temporary dependency remediation

on:
  push:
    branches: [fix/dependency-security-2026-10]

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve safe package updates
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --ignore-scripts --no-fund || true

      - name: Report remaining advisories
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-full.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-runtime.json || true
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          for (const [label, file] of [["all", "/tmp/npm-audit-full.json"], ["runtime", "/tmp/npm-audit-runtime.json"]]) {
            const audit = JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(label, JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, record] of Object.entries(audit.vulnerabilities ?? {})) {
              if (record.severity === "critical" || record.severity === "high") {
                console.log(label, name, "severity", record.severity, "isDirect", record.isDirect, "fixAvailable", JSON.stringify(record.fixAvailable));
              }
            }
          }
          NODE

      - name: Commit regenerated dependency lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency file changes"
          else
            git commit -m "fix(deps): apply non-breaking npm security updates"
            git push origin HEAD:fix/dependency-security-2026-10
          fi
